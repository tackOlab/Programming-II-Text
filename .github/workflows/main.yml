name: Repository dispatch run
on:
  push:
    branches:
    - main
jobs:
  run-repository-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Pages build in playbook repo
        env:
          TOKEN: ${{ secrets.MY_PAT }}
          OWNER: ${{ secrets.OWNER }}
          REPO: ${{ secrets.REPO }}
        run: |
          set -euo pipefail
          status=$(curl \
            --silent --show-error \
            --output /dev/stderr \
            --write-out '%{http_code}' \
            -X POST \
            -H "Authorization: token ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${OWNER}/${REPO}/dispatches" \
            -d '{"event_type":"on-demand-test","client_payload":{"env":"dev"}}')
          echo "HTTP status: ${status}"
          if [ "${status}" != "204" ]; then
            echo "::error::repository_dispatch failed (HTTP ${status}). Check that MY_PAT is valid/not expired and has 'repo' (or contents:write on the playbook repo) scope, and that OWNER/REPO point to the playbook repo." >&2
            exit 1
          fi
